# Render Blueprint — خدمة واحدة تخدم الـ API والواجهة معًا
services:
  - type: web
    name: Misk-Multqa
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm --prefix server install
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Hebron
      - key: DATABASE_URL
        sync: false          # الصقه من Supabase
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false          # اختر كلمة مرور قوية للمسؤول
      - key: JWT_SECRET
        generateValue: true
      - key: CREDENTIALS_KEY
        generateValue: true
      # المهام المجدولة: انسخ القيمة المولّدة إلى database/supabase_cron.sql
      - key: CRON_SECRET
        generateValue: true
      # البريد (Resend) — يبقى معطّلًا حتى توثيق النطاق
      - key: EMAIL_NOTIFICATIONS_ENABLED
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false          # مثال: noreply@your-verified-domain.com
      - key: EMAIL_REPLY_TO
        value: misk.quran26@gmail.com
      # Google Forms / Sheets
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
