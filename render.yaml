# Render Blueprint — خدمة واحدة تخدم الـ API والواجهة معًا
services:
  - type: web
    name: Misk-Multqa
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Hebron
      - key: DATABASE_URL
        sync: false          # الصقه من Supabase
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false          # اختر كلمة مرور قوية للمسؤول
      - key: JWT_SECRET
        generateValue: true
      - key: CREDENTIALS_KEY
        generateValue: true
      # المهام المجدولة: انسخ القيمة المولّدة إلى database/supabase_cron.sql
      - key: CRON_SECRET
        generateValue: true
      # البريد عبر Google Apps Script (MailApp) من misk.quran26@gmail.com — انظر GOOGLE_EMAIL_SETUP.txt
      - key: EMAIL_PROVIDER
        value: google_apps_script
      - key: EMAIL_NOTIFICATIONS_ENABLED
        value: "false"       # اجعله true بعد نشر Apps Script وضبط المتغيرين التاليين
      - key: GAS_WEB_APP_URL
        sync: false          # رابط النشر: https://script.google.com/macros/s/…/exec
      - key: GAS_SHARED_SECRET
        sync: false          # سر عشوائي 32+ حرفًا — نفس القيمة في Script Properties
      - key: EMAIL_REPLY_TO
        value: misk.quran26@gmail.com
      - key: EMAIL_DAILY_LIMIT
        value: "90"          # حد Gmail الشخصي 100 مستلم يوميًا — نترك هامشًا
      # Google Forms / Sheets
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
